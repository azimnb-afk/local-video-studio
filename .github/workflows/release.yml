name: Build and Release

on:
  push:
    tags:
      - 'v0.9.0-preview.*'

permissions:
  contents: write

jobs:
  source-preview:
    name: Build unsigned macOS preview
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app and package unsigned preview
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          BUILD_ROOT="$RUNNER_TEMP/local-video-studio-build"
          DERIVED_DATA="$BUILD_ROOT/DerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/Local Video Studio.app"
          ZIP_PATH="dist/LocalVideoStudio-${VERSION}-unsigned.zip"

          rm -rf "$BUILD_ROOT" dist
          mkdir -p dist

          xcodebuild \
            -project LTXVideoGenerator/LTXVideoGenerator.xcodeproj \
            -scheme LTXVideoGenerator \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            PRODUCT_BUNDLE_IDENTIFIER=com.localvideostudio.personal \
            PRODUCT_NAME='Local Video Studio' \
            INFOPLIST_KEY_CFBundleDisplayName='Local Video Studio' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          test -d "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "${ZIP_PATH}.sha256"
          echo "Packaged $ZIP_PATH"

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Unsigned macOS Preview
          body: |
            This is an unsigned macOS preview build for Apple Silicon.

            Download `LocalVideoStudio-*-unsigned.zip`, expand it, and use Finder's **Open** command the first time to approve the unsigned local preview. No model weights are bundled; configure local models in Preferences.

            A Developer ID signed/notarized distribution is not provided by this preview workflow.
          files: |
            dist/*.zip
            dist/*.sha256
          draft: false
          prerelease: true
          generate_release_notes: false
