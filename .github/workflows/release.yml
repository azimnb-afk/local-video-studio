name: Publish Preview Release

on:
  push:
    tags:
      - 'v0.9.0-preview.*'

permissions:
  contents: write

jobs:
  publish-preview:
    name: Publish verified unsigned macOS preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and bundled preview artifact
        uses: actions/checkout@v4

      - name: Verify bundled preview artifact
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="distribution/LocalVideoStudio-0.9.0-preview.23-unsigned.zip"
          DMG_PATH="distribution/LocalVideoStudio-0.9.0-preview.23-unsigned.dmg"
          test -f "$ZIP_PATH"
          test -f "${ZIP_PATH}.sha256"
          test -f "$DMG_PATH"
          test -f "${DMG_PATH}.sha256"
          shasum -a 256 -c "${ZIP_PATH}.sha256"
          shasum -a 256 -c "${DMG_PATH}.sha256"
          unzip -t "$ZIP_PATH" >/dev/null
          echo "Verified $ZIP_PATH"
          echo "Verified checksum and presence of $DMG_PATH"

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Unsigned macOS Preview
          body: |
            This is an unsigned macOS preview build for Apple Silicon.

            Download the `*-unsigned.zip` asset, expand it, and use Finder's **Open** command the first time to approve the unsigned local preview. No model weights are bundled; configure local models in Preferences.

            An unsigned `.dmg` asset is provided for the same preview. It is not Developer ID signed or notarized.

            A Developer ID signed/notarized distribution is not provided by this preview workflow.
          files: |
            distribution/LocalVideoStudio-0.9.0-preview.23-unsigned.zip
            distribution/LocalVideoStudio-0.9.0-preview.23-unsigned.zip.sha256
            distribution/LocalVideoStudio-0.9.0-preview.23-unsigned.dmg
            distribution/LocalVideoStudio-0.9.0-preview.23-unsigned.dmg.sha256
          draft: false
          prerelease: true
          generate_release_notes: false
