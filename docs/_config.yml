title: Local Video Studio
description: Native macOS studio for AI video generation on Apple Silicon
baseurl: ""
url: ""

remote_theme: just-the-docs/just-the-docs

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Footer content
footer_content: "Distributed under the MIT License."

# Color scheme
color_scheme: dark

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Google Analytics (optional)
# ga_tracking: UA-XXXXXXXXX-X

# Heading anchor links
heading_anchors: true

# Collections for ordering pages
just_the_docs:
  collections:
    docs:
      name: Documentation
      nav_fold: false

# Plugins
plugins:
  - jekyll-seo-tag
